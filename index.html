.btn{--bh:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--bh);padding:0 20px;border-radius:var(--r2);border:1px solid var(--ln);background:var(--sf);font-weight:700;font-size:.95rem;white-space:nowrap;transition:transform .12s var(--e-q),background .2s,border-color .2s,color .2s,box-shadow .2s;position:relative;user-select:none}

.btn.dan{color:var(--er)}.btn.dan:hover{border-color:var(--er);color:var(--er)}.btn.danf{background:var(--er);border-color:var(--er);color:oklch(.99 0 0)}
.btn.sm{--bh:36px;padding:0 13px;font-size:.84rem;border-radius:10px}.btn.lg{--bh:54px;font-size:1.02rem;padding:0 26px}.btn.blk{width:100%}
.btn.icon{width:var(--bh);padding:0}

.btn.busy{color:transparent!important;pointer-events:none}.btn.busy::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-color:var(--pi) var(--pi) transparent transparent;animation:spin .7s linear infinite}
.btn:not(.pri).busy::after{border-color:var(--ink) var(--ink) transparent transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.ib{width:44px;height:44px;border-radius:13px;border:1px solid transparent;background:transparent;display:grid;place-items:center;position:relative;color:var(--ink);transition:background .2s,color .2s}
.ib:hover{background:var(--sf2);color:var(--p)}

.fld label,.lbl{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px}

.req{color:var(--er);font-style:normal}

.pw{position:relative}.pw .inp{padding-left:46px}.pw .eye{position:absolute;left:6px;top:6px;width:36px;height:36px;border:0;background:none;color:var(--mt);display:grid;place-items:center;border-radius:9px}
.chk{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:.92rem}.chk input{width:19px;height:19px;accent-color:var(--p);flex:none}

.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:oklch(.95 0 0)}
.lb .bar button{width:44px;height:44px;border-radius:12px;border:0;background:oklch(.3 .02 262 / .6);color:oklch(.97 0 0);display:grid;place-items:center}
.lb .stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
.lb .stage img{max-width:min(92vw,900px);max-height:78vh;border-radius:14px;transition:transform .35s var(--e-out);cursor:zoom-in;touch-action:none}
.lb .stage img.z{transform:scale(2.2);cursor:zoom-out}
.lb .arr{position:absolute;top:50%;transform:translateY(-50%)}.lb .arr.n{left:16px}.lb .arr.p{right:16px}
@keyframes fd{from{opacity:0}}
/* ====== CART / CHECKOUT ====== */
.cartl{display:grid;grid-template-columns:1fr 370px;gap:24px;align-items:start}
.ci-row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--ln);align-items:center}

.ci-row .ctl{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.ci-row .tot{text-align:left}
.sum{position:sticky;top:140px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:.92rem}
.sum .ln.t{border-top:1px dashed var(--ln);margin-top:8px;padding-top:14px;font-size:1.05rem;font-weight:900}
.sum .ln .g{color:var(--ok)}
.cpn{display:flex;gap:8px;margin:14px 0}.cpn .inp{height:44px;text-transform:uppercase;letter-spacing:.06em}
.cpn-on{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:var(--okb);color:var(--ok);font-size:.86rem;font-weight:700;margin:14px 0}
.ship-bar{height:7px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:6px 0 2px}.ship-bar i{display:block;height:100%;background:var(--s);border-radius:9px;transition:width .6s var(--e-out)}
@media(max-width:960px){.cartl{grid-template-columns:1fr}.sum{position:static}.ci-row{grid-template-columns:78px 1fr;gap:12px}.ci-row img{width:78px;height:78px}.ci-row .tot{grid-column:2;text-align:right;display:flex;justify-content:space-between;align-items:center}.cart-cta{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));inset-inline:0;z-index:var(--z-bnav);background:var(--sf);border-top:1px solid var(--ln);padding:10px 16px;display:flex;align-items:center;gap:12px}.cart-cta .btn{flex:1}}
@media(min-width:961px){.cart-cta{display:none}}
.steps{display:flex;align-items:center;gap:8px;margin:18px 0 22px;font-size:.85rem;font-weight:700;color:var(--mt);flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px}.steps i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--sf2)}
.steps .on{color:var(--ink)}.steps .on i{background:var(--p);color:var(--pi)}.steps .done i{background:var(--s);color:oklch(.99 0 0)}
.steps .ln{flex:0 1 40px;height:2px;background:var(--ln)}
.rc{display:grid;gap:10px}
.rcard{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--ln);border-radius:var(--r2);padding:16px;cursor:pointer;transition:border-color .2s,background .2s}
.rcard:hover{border-color:color-mix(in oklch,var(--p) 50%,var(--ln))}
.rcard:has(input:checked){border-color:var(--p);background:color-mix(in oklch,var(--p) 6%,var(--sf))}
.rcard input{accent-color:var(--p);width:19px;height:19px;margin-top:3px;flex:none}
.rcard .t{flex:1}.rcard b{display:block}.rcard span{font-size:.82rem;color:var(--mt)}
.plans{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ck-t{width:100%;border-collapse:collapse}.ck-t td,.ck-t th{padding:12px 8px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:middle}.ck-t th{font-size:.78rem;color:var(--mt);font-weight:700}.ck-t img{width:56px;height:56px;border-radius:12px;object-fit:cover}
@media(max-width:700px){.ck-t thead{display:none}.ck-t tr{display:grid;grid-template-columns:56px 1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:center}.ck-t td{border:0;padding:0}.ck-t td:nth-child(1){grid-row:span 3}.ck-t td:nth-child(3){grid-column:2}.ck-t td:nth-child(4){grid-column:2}.ck-t td:nth-child(5){grid-row:1;grid-column:3}.ck-t td:nth-child(6){grid-column:3;grid-row:2/4;align-self:end}}
/* gateway */
.gw{max-width:560px;margin:30px auto;background:var(--sf);border:1px solid var(--ln);border-radius:calc(var(--r) + 4px);overflow:hidden;box-shadow:var(--sh2)}

.gw .bd{padding:24px}
.cardv{border-radius:18px;padding:20px;background:linear-gradient(135deg,var(--dk2),var(--dk));color:var(--dki);margin-bottom:18px;font-size:1.2rem;letter-spacing:.12em;direction:ltr;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}

/* receipt */

.rcpt .hdr{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:2px dashed var(--ln);padding-bottom:18px;margin-bottom:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 26px}.kv div{padding:9px 0;border-bottom:1px solid var(--ln)}.kv span{display:block;font-size:.76rem;color:var(--mt)}
/* ====== ACCOUNT ====== */

.accn a:hover,.accn button:hover{background:var(--sf2)}.accn a.on{background:color-mix(in oklch,var(--p) 10%,var(--sf));color:var(--p)}

@media(max-width:960px){.acc{grid-template-columns:1fr}.accn{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px;scrollbar-width:none}.accn .me{display:none}.accn a,.accn button{width:auto;white-space:nowrap}}
.ol{display:grid;gap:12px}
.oi{border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px;background:var(--sf);display:grid;gap:12px}

.oi .imgs{display:flex;gap:6px}.oi .imgs img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--sf2)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sf3);margin:7px 5px 0}
.tl li::after{content:"";position:absolute;right:10px;top:22px;bottom:0;width:2px;background:var(--ln)}
.tl li:last-child::after{display:none}.tl li.on::before{background:var(--s);box-shadow:0 0 0 4px color-mix(in oklch,var(--s) 22%,transparent)}
/* auth */
.auth{max-width:1000px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:calc(var(--r) + 6px);overflow:hidden;box-shadow:var(--sh)}

.auth .art ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:var(--dkm);font-size:.9rem}.auth .art li{display:flex;gap:8px;align-items:center}.auth .art li .ic{color:var(--gold)}

.pwm{height:5px;border-radius:9px;background:var(--sf2);margin-top:8px;overflow:hidden}.pwm i{display:block;height:100%;border-radius:9px;transition:width .3s,background .3s}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}.otp input{width:48px;height:56px;text-align:center;font-size:1.4rem;font-weight:800;border-radius:14px}

/* ====== SHEETS / DRAWERS / POPOVERS ====== */
.scrim{position:fixed;inset:0;background:oklch(.15 .03 262 / .5);z-index:var(--z-sheet);animation:fd .25s}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--sf);z-index:calc(var(--z-sheet) + 1);display:flex;flex-direction:column;animation:slideL .45s var(--e-out);box-shadow:var(--sh2)}
.sheet.r{left:auto;right:0;animation-name:slideR}
.sheet.dlg{top:50%;bottom:auto;left:50%;width:min(460px,calc(100% - 32px));max-height:88dvh;border-radius:calc(var(--r) + 4px);transform:translate(-50%,-50%);animation:pop .3s var(--e-out)}
.sheet .shh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ln);flex:none}

.pop{position:fixed;top:78px;left:max(16px,calc((100vw - var(--w))/2 + 20px));width:min(400px,calc(100vw - 32px));background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh2);z-index:var(--z-drop);animation:rise .3s var(--e-out);max-height:min(72dvh,620px);display:flex;flex-direction:column}

@media(max-width:640px){.pop{top:auto;bottom:0;left:0;width:100%;border-radius:22px 22px 0 0;max-height:80dvh;animation:upS .4s var(--e-out)}}

/* mini cart */

.faq details{border-bottom:1px solid var(--ln)}.faq summary{padding:14px 2px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--p);transition:transform .25s}.faq details[open] summary::after{transform:rotate(45deg)}.faq details p{padding:0 2px 14px;color:var(--mt);font-size:.9rem;line-height:2}

<script>
'use strict';
/* کپی تمیز از خود سایت برای ساخت «نسخه بروز سایت» در همگام‌سازی */
const SRC_HTML=(()=>{try{const c=document.documentElement.cloneNode(true);c.querySelectorAll('#kl-data,#gf').forEach(x=>x.remove());[...c.attributes].forEach(x=>c.removeAttribute(x.name));c.setAttribute('lang','fa');c.setAttribute('dir','rtl');const app=c.querySelector('#app');if(app)app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:Tahoma">در حال بارگذاری فروشگاه...</div>';['#layer','#pop','#toasts'].forEach(q=>{const e=c.querySelector(q);if(e)e.innerHTML=''});return '<!doctype html>\n'+c.outerHTML}catch(e){return ''}})();
/* =====================================================================
   کالانو | فروشگاه تک‌فایلی
   بخش‌ها: CONFIG · UTILITIES · STORAGE · ART · SEED · VALIDATION · STATE
   نکته معماری: هر چیزی که به سرور نیاز دارد پشت یک «آداپتر» است
   (API, OTP, PAYMENT). برای اتصال بک‌اند واقعی فقط همان آداپترها عوض می‌شوند.
   ===================================================================== */

/* ============================== CONFIG ============================== */
const CONFIG={
 version:2,
 keys:{db:'kalano_db',cart:'kalano_cart',favs:'kalano_favs',theme:'kalano_theme',session:'kalano_session',admin:'kalano_admin',hist:'kalano_hist',guest:'kalano_guest',cpn:'kalano_cpn',draft:'kalano_draft',prefs:'kalano_prefs',recent:'kalano_recent',cmp:'kalano_cmp'},

 statuses:{pending:['در انتظار پرداخت','wr'],paid:['پرداخت‌شده','in'],processing:['در حال پردازش','in'],shipped:['ارسال‌شده','p'],completed:['تکمیل‌شده','ok'],canceled:['لغوشده','er']}

/* ============================== UTILITIES ============================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const FAD='۰۱۲۳۴۵۶۷۸۹',ARD='٠١٢٣٤٥٦٧٨٩';
const fa=v=>String(v??'').replace(/\d/g,d=>FAD[d]);
const toEn=s=>String(s??'').replace(/[۰-۹]/g,d=>FAD.indexOf(d)).replace(/[٠-٩]/g,d=>ARD.indexOf(d));
/* همه متن‌های پویا فقط از این تابع رد می‌شوند (جلوگیری از XSS) */
const h=s=>String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const sep=n=>Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'٬');
const money=n=>fa(sep(n));
const T=n=>`${money(n)}<small>تومان</small>`;
const uid=(p='')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byId=(a,id)=>a.find(x=>x.id===id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const num=v=>{const n=Number(toEn(v).replace(/[,٬\s]/g,''));return isFinite(n)?n:NaN};
const safeUrl=u=>/^(https?:\/\/|mailto:|tel:)/i.test(String(u||''))?String(u):'';
function hp(p,salt='kalano'){const s=salt+':'+p;let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16)+(h1>>>0).toString(16)}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* نرمال‌سازی فارسی برای جستجو */
const norm=s=>toEn(String(s||'')).toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ة]/g,'ه').replace(/[أإآ]/g,'ا').replace(/ؤ/g,'و').replace(/[\u064B-\u065F\u0670\u200c\u200d\u200f]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* ---------- تقویم جلالی (الگوریتم jalaali) ---------- */
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
function jalCal(jy){const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];let gy=jy+621,leapJ=-14,jp=br[0],jm,jump=0,leap,leapG,march,n,i;for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}

const jMonthLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jLeap(jy)?30:29);
const pad=n=>String(n).padStart(2,'0');
const fmtJ=j=>j.jy+'/'+pad(j.jm)+'/'+pad(j.jd);
const jFromDate=d=>fmtJ(d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate())));
const jToday=()=>jFromDate(new Date());
function parseJ(s){const m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(toEn(s).trim());if(!m)return null;const jy=+m[1],jm=+m[2],jd=+m[3];if(jy<1300||jy>1500||jm<1||jm>12||jd<1||jd>jMonthLen(jy,jm))return null;return{jy,jm,jd}}
const normJ=s=>{const p=parseJ(s);return p?fmtJ(p):null};
const jAdd=(s,n)=>{const p=parseJ(s);return fmtJ(d2j(j2d(p.jy,p.jm,p.jd)+n))};
const iranDay=s=>{const p=parseJ(s);const g=d2g(j2d(p.jy,p.jm,p.jd));return (new Date(g.gy,g.gm-1,g.gd).getDay()+1)%7};
const WDN=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jLong=s=>{const p=parseJ(s);return p?fa(p.jd)+' '+MONTHS[p.jm-1]+' '+fa(p.jy):'—'};
const jShort=s=>s?fa(s):'—';
const tsFmt=t=>{const d=new Date(t);return fa(jFromDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()))};
const jNow=()=>jFromDate(new Date());
const dateFa=t=>{const d=new Date(t);const j=d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate()));return fa(j.jd)+' '+MONTHS[j.jm-1]+' '+fa(j.jy)};
const timeFa=t=>{const d=new Date(t);return fa(pad(d.getHours())+':'+pad(d.getMinutes()))};
const dtFa=t=>dateFa(t)+'، '+timeFa(t);
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return 'همین حالا';if(s<3600)return fa(Math.floor(s/60))+' دقیقه پیش';if(s<86400)return fa(Math.floor(s/3600))+' ساعت پیش';if(s<86400*7)return fa(Math.floor(s/86400))+' روز پیش';return dateFa(t)};

/* ============================== STORAGE ============================== */
/* لایه ذخیره‌سازی: localStorage برای داده‌ها، IndexedDB برای تصاویر.
   در صورت نبود دسترسی (حالت پیش‌نمایش)، حافظه موقت استفاده می‌شود. */
const STORAGE=(()=>{const mem={};let ok=true,ls;try{ls=window.localStorage;ls.setItem('__k','1');ls.removeItem('__k')}catch(e){ok=false}
 const get=k=>{try{return ok?ls.getItem(k):(k in mem?mem[k]:null)}catch(e){return null}};
 const set=(k,v)=>{try{if(ok)ls.setItem(k,v);else mem[k]=v;return true}catch(e){return false}};
 const del=k=>{try{if(ok)ls.removeItem(k);else delete mem[k]}catch(e){}};
 return{ok,get,set,del,json:(k,d)=>{try{const v=get(k);return v==null?d:JSON.parse(v)}catch(e){return d}},setJson:(k,v)=>set(k,JSON.stringify(v))}})();
const IMGDB=(()=>{let dbp=null;const cache=new Map();
 function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('kalano',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}

function compressImage(file){return new Promise((res,rej)=>{if(!/^image\/(png|jpe?g|webp|gif)$/.test(file.type))return rej(new Error('فقط تصویر PNG، JPG یا WEBP مجاز است'));if(file.size>15*1024*1024)return rej(new Error('حجم تصویر بیش از ۱۵ مگابایت است'));const rd=new FileReader();rd.onerror=()=>rej(new Error('خواندن فایل ناموفق بود'));rd.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('فایل تصویر معتبر نیست'));im.onload=()=>{const m=CONFIG.maxImage,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.84))};im.src=rd.result};rd.readAsDataURL(file)})}

const SYNC_COLLS=['products','categories','users','orders','coupons','reviews','notifs','sellers','tickets'];
const FRONT=new Set(['products','orders','coupons','notifs']);
const stampOf=x=>+(x&&(x.updated||x.at||x.created))||0;
function usedImages(db){const refs=new Set();db.products.forEach(p=>(p.images||[]).forEach(r=>{if(typeof r==='string'&&r.startsWith('idb:'))refs.add(r.slice(4))}));if(db.settings.logo&&db.settings.logo.startsWith('idb:'))refs.add(db.settings.logo.slice(4));const out={};refs.forEach(k=>{const v=IMGDB.cache.get(k);if(isDataImg(v))out[k]=v});return out}
function mergeDb(a,b){const out=JSON.parse(JSON.stringify(a));const tb={...(a.tomb||{})};for(const k in b.tomb||{})tb[k]=Math.max(tb[k]||0,+b.tomb[k]||0);const st={added:0,updated:0,removed:0};
 for(const c of SYNC_COLLS){const loc=out[c]||[];const map=new Map(loc.map(x=>[x.id,x]));const fresh=[];
  for(const y of b[c]||[]){if(!y||!y.id)continue;const x=map.get(y.id);if(!x){map.set(y.id,y);fresh.push(y.id);st.added++}else if(stampOf(y)>stampOf(x)&&JSON.stringify(x)!==JSON.stringify(y)){map.set(y.id,y);st.updated++}}
  const order=FRONT.has(c)?[...fresh,...loc.map(x=>x.id)]:[...loc.map(x=>x.id),...fresh];const arr=[];
  for(const id of order){const x=map.get(id);const t=tb[c+':'+id];if(t&&t>=stampOf(x)){if(!fresh.includes(id))st.removed++;else st.added--;continue}arr.push(x)}out[c]=arr}
 if(FRONT.has('orders'))out.orders.sort((x,y)=>(y.at||0)-(x.at||0));
 const ch=b.chats||{};for(const k in ch){const x=out.chats[k];if(!x||(+ch[k].updated||0)>(+x.updated||0))out.chats[k]=ch[k]}
 out.subs=[...new Set([...(out.subs||[]),...(b.subs||[])])];const sk=new Set((out.sent||[]).map(x=>x.at+'|'+x.title));(b.sent||[]).forEach(x=>{if(!sk.has(x.at+'|'+x.title))out.sent.push(x)});
 const am=a.meta||{},bm=b.meta||{};if((bm.settings||0)>(am.settings||0)){out.settings=JSON.parse(JSON.stringify(b.settings));st.settings=1}if((bm.admins||0)>(am.admins||0))out.admins=b.admins;
 out.meta={...am,settings:Math.max(am.settings||0,bm.settings||0),admins:Math.max(am.admins||0,bm.admins||0),seen:[...new Set([...(am.seen||[]),...(bm.seen||[])])].slice(-60)};out.tomb=tb;return{db:validateDb(out),stat:st}}

 const im=document.createElement('img');im.className='fly';im.alt='';im.src=imgSrc(p.images[0]);const sz=Math.min(sr.width,sr.height,160);const x0=sr.left+(sr.width-sz)/2,y0=sr.top+(sr.height-sz)/2;Object.assign(im.style,{left:x0+'px',top:y0+'px',width:sz+'px',height:sz+'px'});document.body.appendChild(im);

/* ---------- آپلود تصویر مقاوم (عکس دوربین گوشی، فرمت‌های بیشتر، فایل بدون نوع) ---------- */
const IMG_EXT=/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/i;
function compressImage(file){return new Promise(async(res,rej)=>{
 const name=String(file&&file.name||''),type=String(file&&file.type||'').toLowerCase();
 if(!file||(type&&!type.startsWith('image/')&&type!=='application/octet-stream'&&!IMG_EXT.test(name)))return rej(new Error('این فایل تصویر نیست. یک عکس (JPG، PNG، WEBP) انتخاب کنید.'));
 if(file.size>40*1024*1024)return rej(new Error('حجم تصویر بیش از ۴۰ مگابایت است؛ یک عکس سبک‌تر انتخاب کنید.'));
 const isHeic=/heic|heif/.test(type)||/\.(heic|heif)$/i.test(name);
 const M=CONFIG.maxImage||1400;
 const draw=(src,w,h)=>{const sc=Math.min(1,M/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);let d='';try{d=c.toDataURL('image/jpeg',.85)}catch(e){}if(!isDataImg(d))throw new Error('پردازش تصویر ممکن نشد');return d};
 /* روش ۱: createImageBitmap (کم‌مصرف، چرخش درست عکس) */
 if(window.createImageBitmap){try{const bm=await createImageBitmap(file,{imageOrientation:'from-image'});const d=draw(bm,bm.width,bm.height);bm.close&&bm.close();return res(d)}catch(e){/* روش بعدی */}}
 /* روش ۲: آدرس موقت + Image */
 const tryImg=src=>new Promise((ok,no)=>{const im=new Image();im.decoding='async';im.onload=()=>{try{ok(draw(im,im.naturalWidth,im.naturalHeight))}catch(e){no(e)}};im.onerror=()=>no(new Error('x'));im.src=src});
 let url='';try{url=URL.createObjectURL(file);const d=await tryImg(url);URL.revokeObjectURL(url);return res(d)}catch(e){if(url)URL.revokeObjectURL(url)}
 /* روش ۳: FileReader (برای مرورگرهای قدیمی) */
 try{const du=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=()=>no(new Error('x'));rd.readAsDataURL(file)});return res(await tryImg(du))}catch(e){}
 rej(new Error(isHeic?'عکس با فرمت HEIC است و این مرورگر آن را باز نمی‌کند. در تنظیمات دوربین گوشی «فرمت پربازده/HEIF» را خاموش کنید، یا از عکس اسکرین‌شات بگیرید و همان را آپلود کنید.':'این تصویر باز نشد (ممکن است خراب یا فرمتش ناشناخته باشد). یک عکس JPG یا PNG دیگر امتحان کنید.'))})}
async function uploadImgs(files,target='product'){const list=[...(files||[])];if(!list.length)return;const room=target==='logo'?1:Math.max(0,8-PF.images.length);if(!room)return toast('حداکثر ۸ تصویر برای هر محصول مجاز است','wr');const arr=list.slice(0,room);

const INV={
 vel(p){const days=Math.max(30,(Date.now()-(p.created||Date.now()))/864e5);return Math.max(.02,(p.sold||0)/days/4)},
 cover(p){return p.stock/INV.vel(p)},
 low:()=>S.db.products.filter(p=>p.active&&p.stock>0&&p.stock<=CONFIG.lowStock).sort((a,b)=>a.stock-b.stock),
 out:()=>S.db.products.filter(p=>p.active&&p.stock<=0),
 best:(n=10)=>S.db.products.filter(p=>p.active).sort((a,b)=>b.sold-a.sold).slice(0,n),
 restock(){const top=new Set(INV.best(60).map(p=>p.id));const cov=S.db.settings.invCover||14;return S.db.products.filter(p=>p.active&&(p.stock<=0||p.stock<=CONFIG.lowStock||(top.has(p.id)&&INV.cover(p)<cov))).map(p=>({p,need:Math.max(1,Math.ceil(INV.vel(p)*cov*2)-p.stock),cover:INV.cover(p),hot:top.has(p.id)})).sort((a,b)=>a.cover-b.cover)},
 scan(){const db=S.db;if(!db||!db.products)return;const ids=[];const now=Date.now();db.alerts=db.alerts||[];const prev=db.meta.invLow;const ps=new Set(prev||[]);
  db.products.forEach(p=>{if(!p.active)return;const k=p.stock<=0?'out':p.stock<=CONFIG.lowStock?'low':'';if(!k)return;const key=p.id+':'+k;ids.push(key);if(prev&&!ps.has(key))db.alerts.unshift({id:uid('al'),kind:k,pid:p.id,t:k==='out'?`«${p.name.slice(0,50)}» ناموجود شد.`:`موجودی «${p.name.slice(0,50)}» به ${fa(p.stock)} عدد رسیده است.`,at:now,read:false})});
  if(!prev){const o=ids.filter(x=>x.endsWith(':out')).length,l=ids.length-o;if(ids.length)db.alerts.unshift({id:uid('al'),kind:'info',pid:'',t:`بررسی اولیه انبار: ${fa(l)} کالا کم‌موجود و ${fa(o)} کالا ناموجود است.`,at:now,read:false})}
  db.meta.invLow=ids;if(db.alerts.length>200)db.alerts.length=200}};

 key:'kalano_aia',

 brands(){const set=new Set([...Object.keys(BRAND_FA),...PRODUCTS.brands()]);return [...set].sort((a,b)=>b.length-a.length)},
 brandOf(t){const n=' '+norm(t)+' ';for(const b of AIA.brands()){const bl=b.toLowerCase();if(n.includes(' '+bl+' ')||n.includes(' '+bl))return b;const f=norm(BRAND_FA[b]||PRODUCTS.brandFa(b)||'');if(f.length>2&&n.includes(' '+f))return b}return ''},
 money(t){const x=toEn(String(t)).replace(/٫/g,'.').replace(/[,٬]/g,'');let m=x.match(/(\d+(?:\.\d+)?)\s*(میلیون|ملیون|م\b|m\b)/i);if(m)return Math.round(+m[1]*1e6);m=x.match(/(\d+(?:\.\d+)?)\s*(هزار|k\b)/i);if(m)return Math.round(+m[1]*1e3);m=x.match(/(\d{4,})/);return m?+m[1]:0},
 int(t){const m=toEn(String(t)).match(/(\d+)/);return m?+m[1]:NaN},
 findP(t,n=5){const q=norm(String(t).replace(/موجودی|قیمت|را|رو|به|کن|بکن|بذار|تغییر بده|تا|عدد|اضافه|غیرفعال|فعال|تخفیف|درصد|میلیون|هزار|تومان|[\d٫.,]+/g,' ')).trim();if(q.length<2)return[];return SEARCH.run(q).slice(0,n).concat(S.db.products.filter(p=>!p.active&&norm(p.name).includes(q))).slice(0,n)},
 typeWord(cat,sub){return sub==='تبلت'?'تبلت':{mobile:'گوشی',laptop:'لپ‌تاپ',audio:sub==='اسپیکر'?'اسپیکر':sub==='هدفون'?'هدفون':'هندزفری بی‌سیم',watch:sub==='مچ‌بند هوشمند'?'مچ‌بند هوشمند':'ساعت هوشمند',gaming:sub||'لوازم گیمینگ',camera:sub==='پهپاد'?'کوادکوپتر':'دوربین',home:'',acc:sub||'',tv:sub||'تلویزیون'}[cat]||''},
 /* ساخت پیش‌نویس محصول از متن مدیر */
 draft(text){const brand=AIA.brandOf(text);let raw=String(text).replace(/[«»"']/g,' ');let model=(raw.match(/[A-Za-z0-9][A-Za-z0-9 +\-./]*[A-Za-z0-9+]|[A-Za-z0-9]/g)||[]).join(' ').replace(/\s+/g,' ').trim();if(brand)model=model.replace(new RegExp('\\b'+brand.replace(/[^\w]/g,'.?')+'\\b','i'),'').trim();
  model=model.replace(/\b\d+(\.\d+)?\s*(?=$)/,'').trim();const pr=AIA.money((raw.match(/قیمت[^\d۰-۹]*([\d۰-۹٫.,]+\s*(?:میلیون|هزار|م)?)/)||[])[1]||'');const sk=AIA.int((raw.match(/(?:موجودی|تعداد)[^\d۰-۹]*([\d۰-۹]+)/)||raw.match(/([\d۰-۹]+)\s*(?:عدد|تا|دستگاه)\b/)||[])[1]||'');
  if(pr)model=model.replace(new RegExp('\\b'+String(Math.round(pr/1e6))+'\\b'),'').trim();if(!isNaN(sk))model=model.replace(new RegExp('\\b'+sk+'\\b'),'').trim();
  const toks=norm(model).split(' ').filter(Boolean);let tpl=null,bs=-1;S.db.products.forEach(p=>{let s=0;if(brand&&p.brand===brand)s+=3;const pm=norm(p.model||p.name).split(' ');toks.forEach((w,i)=>{if(pm.includes(w))s+=i===0?3:1.5});if(s>bs){bs=s;tpl=p}});
  let cat=AIC.cat(text)||'';if(tpl&&(bs>=4||!cat))cat=cat&&bs<4.5?cat:tpl.cat;if(!cat)cat='acc';if(tpl&&tpl.cat!==cat)tpl=S.db.products.filter(p=>p.cat===cat&&(!brand||p.brand===brand))[0]||S.db.products.find(p=>p.cat===cat)||tpl;
  const sub=tpl&&tpl.cat===cat?tpl.subcat:(SUB_DEF[cat]||'');const bf=brand?(BRAND_FA[brand]||PRODUCTS.brandFa(brand)):'';const tw=AIA.typeWord(cat,sub);const name=[tw,bf,model].filter(Boolean).join(' ').trim();

  const series=(model.split(' ')[0]||'');const long=`${model||'این محصول'} ${bf?'از '+bf:''} جدیدترین عضو${series?' خانواده '+series:''} در دسته ${PRODUCTS.cat(cat)?.name||''} است. ${tpl?'از نظر کاربری، رقیب و هم‌رده «'+tpl.name.slice(0,60)+'» محسوب می‌شود. ':''}کیفیت ساخت بالا، گارانتی معتبر و ارسال سریع ${S.db.settings.name}، خریدی مطمئن را برای شما فراهم می‌کند.`;

 next(d){if(!d.brand&&!d.model)return 'model';if(!d.model)return 'model';if(!(d.price>0))return 'price';if(d.stock==null)return 'stock';return 'preview'},
 ask(stage,d){return stage==='model'?`مدل دقیق ${d.brandFa||'محصول'} چیست؟ (مثلاً Galaxy S25 Ultra)`:stage==='price'?`«${d.name}» را تشخیص دادم: دسته ${PRODUCTS.cat(d.cat)?.name||'—'}${d.subcat?' / '+d.subcat:''}. ${d.tpl?'مشخصات را از مدل مشابه «'+(PRODUCTS.get(d.tpl)?.name||'').slice(0,50)+'» پیش‌نویس کردم (لطفاً قبل از انتشار بررسی کنید).':''}\nقیمت فروش چند تومان است؟ (مثلاً ۴۵ میلیون)`:stage==='stock'?'موجودی اولیه چند عدد است؟':'پیش‌نویس آماده است. بررسی کنید و اگر درست است تأیید کنید. تا تأیید نکنید چیزی منتشر نمی‌شود.'},
 inv(){const low=INV.low(),out=INV.out(),rs=INV.restock().slice(0,8),best=INV.best(5);return{t:`گزارش هوشمند انبار:\n• کم‌موجود (≤ ${fa(CONFIG.lowStock)}): ${fa(low.length)} کالا\n• ناموجود: ${fa(out.length)} کالا\n• نیاز فوری به تأمین: ${fa(rs.length)} مورد (بر اساس سرعت فروش و پوشش ${fa(S.db.settings.invCover||14)} روزه)\n${low.slice(0,5).map(p=>`⚠️ موجودی «${p.name.slice(0,45)}» به ${fa(p.stock)} عدد رسیده است.`).join('\n')}\nپرفروش‌ها: ${best.map(p=>p.brandFa+' '+(p.model||'')).join('، ')}`,restock:rs.map(x=>({id:x.p.id,need:x.need}))}},
 handle(text){const t=String(text).trim(),n=norm(t);const s=AIA.st();const d=s.pend&&s.pend.type==='add'?s.pend:null;
  if(/^(لغو|انصراف|بیخیال|cancel)$/.test(n)){s.pend=null;return{t:'باشه، لغو شد. هیچ تغییری اعمال نشد.'}}

   d.stage=AIA.next(D);return{t:AIA.ask(d.stage,D),preview:d.stage==='preview'}}
  if(/^(راهنما|کمک|help|چه کارهایی)/.test(n))return{t:'نمونه دستورها:\n• «یک Samsung Galaxy S25 جدید آوردم، قیمت ۵۲ میلیون، ۱۰ عدد»\n• «موجودی Galaxy Buds را ۲۰ کن» یا «۵ عدد AirPods 4 رسید»\n• «قیمت iPhone 15 را ۷۸ میلیون کن» یا «۱۰ درصد تخفیف روی JBL Flip 6»\n• «Redmi Note 13 را غیرفعال کن»\n• «گزارش انبار» / «کم‌موجودها» / «پرفروش‌ها»\n• «اعلان: حراج آخر هفته شروع شد»\nهر تغییری فقط بعد از تأیید شما انجام می‌شود.'};
  if(/گزارش انبار|وضعیت انبار|کم موجود|کمموجود|کم‌موجود|ناموجود|تامین|تأمین|پرفروش|موجودی انبار|هشدار/.test(n)&&!/(\d)/.test(toEn(t)))return AIA.inv();
  let m=t.match(/^(?:اعلان|اطلاعیه|خبر|پیام همگانی)\s*[:：]?\s*(.{4,})$/);if(m){const body=m[1].trim();s.pend={type:'notify',ntype:/تخفیف|حراج/.test(body)?'discount':'news',title:body.split(/[.!؟\n]/)[0].slice(0,80),body:body.slice(0,500)};return{t:'پیش‌نویس اعلان عمومی آماده شد. با تأیید شما برای همه مشتریان ارسال می‌شود.',confirm:true}}

   s.pend={type:'stock',pid:p.id,from:p.stock,to};return{t:`موجودی «${p.name.slice(0,60)}» از ${fa(p.stock)} به ${fa(to)} عدد تغییر می‌کند.${p.stock<=0&&to>0?' مشتریانی که منتظر بودند اعلان «موجود شد» می‌گیرند.':''}${ps.length>1?'\nاگر منظورتان کالای دیگری است: '+ps.slice(1,4).map(x=>'«'+x.name.slice(0,35)+'»').join('، '):''}`,confirm:true,alt:ps.slice(1,4).map(x=>x.id)}}

/* KALACHIN_CLOUD_ORDERS_PATCH_V1 */
const KALACHIN_REMOTE_ORDERS = new Map();
let KALACHIN_ORDERS_LOADING = null;
let KALACHIN_ORDERS_LOADED_AT = 0;

function kalachinParseJSON(v, fallback) {
  if (typeof v !== 'string') return v == null ? fallback : v;
  try { return JSON.parse(v); } catch (_) { return fallback; }
}

function kalachinNormalizeOrder(row) {
  const id = String(row.id || '');
  if (!id) return null;

  const validStatus = Object.prototype.hasOwnProperty.call(
    CONFIG.statuses, String(row.status || '')
  );
  const status = validStatus ? String(row.status) : 'pending';
  const at = Date.parse(row.created_at || '') || Date.now();
  const history = kalachinParseJSON(row.history, []);
  const items = kalachinParseJSON(row.items, []);
  const address = kalachinParseJSON(row.address, {});
  const payment = kalachinParseJSON(row.payment, null);

  return {
    id,
    uid: String(row.customer_id || ''),
    customer: String(row.customer_name || 'مشتری'),
    mobile: String(row.mobile || ''),
    items: (Array.isArray(items) ? items : []).map(i => ({
      id: String(i.id || ''),
      name: String(i.name || i.title || 'کالا'),
      price: Number(i.price) || 0,
      img: String(i.img || i.image || i.image_url || ''),
      qty: Math.max(1, Number(i.qty) || 1)
    })),
    sub: Number(row.subtotal) || 0,
    disc: Number(row.discount) || 0,
    ship: Number(row.shipping) || 0,
    total: Number(row.total) || 0,
    pointsUsed: Number(row.points_used) || 0,
    ptsDisc: Number(row.points_discount) || 0,
    updated: Date.parse(row.updated_at || '') || at,
    coupon: row.coupon || '',
    method: row.method === 'installment' ? 'installment' : 'online',
    plan: Number(row.plan) || 0,
    delivery: row.delivery === 'express' ? 'express' : 'normal',
    address: address && typeof address === 'object' ? address : {},
    status,
    at,
    history: (Array.isArray(history) ? history : []).map(x => ({
      s: x.status || x.s || 'pending',
      at: Date.parse(x.at || '') || at,
      note: x.note || ''
    })),
    pay: payment && typeof payment === 'object' ? payment : null,
    remoteCloud: true
  };
}

async function kalachinLoadOrders(force = false) {
  if (!CLOUD.on() || !CLOUD.ses()) return Promise.resolve(false);
  if (KALACHIN_ORDERS_LOADING) return KALACHIN_ORDERS_LOADING;
  if (!force && Date.now() - KALACHIN_ORDERS_LOADED_AT < 15000) return Promise.resolve(true);

  KALACHIN_ORDERS_LOADING = (async () => {
    try {
      const rows = await CLOUD.raw(
        CLOUD.q('Orders') + '?select=*&order=created_at.desc',
        { method: 'GET', auth: true, ms: 30000 }
      );

      if (!Array.isArray(rows)) throw new Error('پاسخ فهرست سفارش‌ها معتبر نیست.');

      const fresh = new Map();
      for (const row of rows) {
        const o = kalachinNormalizeOrder(row);
        if (o) fresh.set(o.id, { row, order: o });
      }

      KALACHIN_REMOTE_ORDERS.clear();
      for (const [id, value] of fresh) KALACHIN_REMOTE_ORDERS.set(id, value);
      KALACHIN_ORDERS_LOADED_AT = Date.now();

      console.info('Kalachin: سفارش‌های سرور دریافت شدند:', fresh.size);
      return true;
    } catch (e) {
      console.error('Kalachin cloud orders:', e);
      toast('دریافت سفارش‌های سرور ناموفق بود: ' + e.message, 'er');
      return false;
    } finally {
      KALACHIN_ORDERS_LOADING = null;
    }
  })();

  return KALACHIN_ORDERS_LOADING;
}

const KALACHIN_ORIGINAL_ADM_ORDERS = admOrders;
admOrders = function(sub) {
  if (sub && KALACHIN_REMOTE_ORDERS.has(String(sub))) {
    const o = KALACHIN_REMOTE_ORDERS.get(String(sub)).order;
    return `<a class="btn ghost sm" href="#/admin/orders" style="margin-bottom:10px">
      ${ic('chevr',16)} همه سفارش‌ها</a>
      <div class="card" style="margin-bottom:14px">
      <div class="row"><b>تغییر وضعیت سفارش سرور:</b>${stSel(o)}</div>
      <p class="xs muted">تغییر وضعیت فقط پس از تأیید دیتابیس ثبت‌شده محسوب می‌شود.</p>
      </div>${orderDetail(o,true)}`;
  }

  if (sub) return KALACHIN_ORIGINAL_ADM_ORDERS(sub);

  const original = S.db.orders;
  const remote = [...KALACHIN_REMOTE_ORDERS.values()].map(x => x.order);
  const ids = new Set(remote.map(o => o.id));
  S.db.orders = [...original.filter(o => !ids.has(String(o.id))), ...remote];

  try {
    return KALACHIN_ORIGINAL_ADM_ORDERS();
  } finally {
    S.db.orders = original;
  }
};

document.addEventListener('change', async function(e) {
  const t = e.target;
  if (!t || !t.dataset || !t.dataset.ost) return;

  const id = String(t.dataset.ost);
  if (!KALACHIN_REMOTE_ORDERS.has(id)) return;

  e.preventDefault();
  e.stopImmediatePropagation();

  const entry = KALACHIN_REMOTE_ORDERS.get(id);
  const oldStatus = entry.order.status;
  const newStatus = String(t.value || '');

  if (!Object.prototype.hasOwnProperty.call(CONFIG.statuses, newStatus)) {
    toast('وضعیت انتخاب‌شده معتبر نیست.', 'er');
    renderMain();
    return;
  }
  if (newStatus === oldStatus) return;

  t.disabled = true;
  try {
    const oldHistory = kalachinParseJSON(entry.row.history, []);
    const history = Array.isArray(oldHistory) ? oldHistory.slice() : [];
    const now = new Date().toISOString();
    history.push({
      status: newStatus,
      at: now,
      note: 'وضعیت توسط مدیر فروشگاه تغییر کرد.'
    });

    const result = await CLOUD.raw(
      CLOUD.q('Orders') + '?id=eq.' + encodeURIComponent(id),
      {
        method: 'PATCH',
        body: {
          status: newStatus,
          history,
          updated_at: now
        },
        headers: { Prefer: 'return=representation' },
        auth: true,
        ms: 30000
      }
    );

    if (!Array.isArray(result) || !result.length) {
      throw new Error('سرور هیچ سفارشی را تغییر نداد؛ مجوز UPDATE را بررسی کنید.');
    }

    const row = result[0];
    const order = kalachinNormalizeOrder(row);
    if (!order) throw new Error('سفارش به‌روزشده قابل خواندن نیست.');

    KALACHIN_REMOTE_ORDERS.set(id, { row, order });
    toast('وضعیت سفارش ' + id + ' در دیتابیس ذخیره شد.', 'ok');
    renderMain();
  } catch (err) {
    console.error('Kalachin order update:', err);
    toast('ذخیره وضعیت ناموفق بود: ' + err.message, 'er');
    renderMain();
  }
}, true);

const KALACHIN_ORIGINAL_RENDER_MAIN = renderMain;
renderMain = function() {
  const route = parseRoute();
  if (route.name === 'admin' && CLOUD.on() && CLOUD.ses()) {
    kalachinLoadOrders().then(ok => {
      if (ok && parseRoute().name === 'admin') {
        KALACHIN_ORIGINAL_RENDER_MAIN();
      }
    });
  }
  return KALACHIN_ORIGINAL_RENDER_MAIN();
};
